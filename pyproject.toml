[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mongodb-database-load-process"
version = "0.1.0"
description = "Config-driven SQL + CSV to MongoDB load utility"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anshul" }]

dependencies = [
    "sqlalchemy>=2.0",
    "pymongo>=4.6,<4.9",  # mongomock 4.3.0 (latest) doesn't support pymongo>=4.9's bulk UpdateOne 'sort' kwarg
    "pandas>=2.1",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "typer>=0.9",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
mysql = ["pymysql>=1.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mongomock>=4.1",
    "ruff>=0.4",
    "black>=24.0",
]

[project.scripts]
loader = "loader.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py311"]
