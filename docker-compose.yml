services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./sample_data/seed_customers.sql:/docker-entrypoint-initdb.d/seed_customers.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  loader:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: portfolio_load
      SQL_CONN_STRING: postgresql+psycopg2://postgres:postgres@postgres:5432/postgres
      LOG_LEVEL: INFO
    # `docker compose up` just brings this up idle; invoke real loads with:
    #   docker compose run --rm loader run --source csv --config configs/orders_csv.yaml
    #   docker compose run --rm loader run --source sql --config configs/customers_sql.yaml
    command: ["--help"]
